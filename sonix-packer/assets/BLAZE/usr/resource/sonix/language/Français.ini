musicsettings_album_view = Vue albums
musicsettings_artist_opens_albums_note = Toucher un artiste ou un genre ouvre ses albums au lieu de ses titres. Désactivée, on retrouve la liste des titres.
musicsettings_album_head = Vue album alternative
musicsettings_album_head_note = Activée, un album s'ouvre avec sa pochette en haut, avec le titre, l'artiste, le genre et l'année, et les morceaux en dessous. Les morceaux affichent leur numéro à la place de la pochette.
musicsettings_rearrange_main_page = Réorganiser la page principale
musictiles_keep_one = Au moins une tuile doit rester sur la page
musicsettings_go_to_current = Aller au morceau en cours
musicsettings_go_to_current_note = Tous les morceaux, Albums, Artistes, Artistes d'album et Genres s'ouvrent sur ce qui est en lecture : le morceau lui-même, ou son album, son artiste ou son genre.
musicsettings_allow_delete = Autoriser la suppression des morceaux
musicsettings_allow_delete_note = En mode sélection, une corbeille rouge apparaît : elle supprime les morceaux choisis de la carte et de la bibliothèque, après confirmation. C'est irréversible.
musicsettings_shows_the_tracks_audio_quality_wi = Affiche la qualité audio de la piste avec un indicateur coloré.
musicsettings_show_artist = Afficher l'artiste
musicsettings_show_artist_note = Affiche l'artiste sous le titre dans les listes choisies : celui du morceau pour les morceaux, celui de l'album pour les albums et, dans un album, celui du morceau quand ce n'est pas celui de l'album.
musicsettings_library = Bibliothèque
musicsettings_now_playing = Now Playing
musicsettings_track_artist = Utiliser l'artiste du morceau
musicsettings_track_artist_note = Affiche l'artiste du morceau au lieu de l'artiste de l'album dans Now Playing, le Centre de contrôle et l'économiseur d'écran. Un morceau sans artiste garde celui de l'album.
medialist_play_in_random_order = Lire dans un ordre aleatoire
medialist_play_in_sequence = Lire dans l'ordre
