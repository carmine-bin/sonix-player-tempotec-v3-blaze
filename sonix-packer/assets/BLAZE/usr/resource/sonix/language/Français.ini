musicsettings_cover_accent_note = Lorsqu'elle est activée, les dispositions Normale et Alternative utilisent aussi la couleur principale de la pochette comme couleur d'accent, comme Waveform.
musicsettings_filter_note = Le filtre d'interpolation du DAC CS43198. Il modifie légèrement la réponse en haute fréquence et la latence ; Fast roll-off à faible latence est le réglage d'usine.
musicsettings_filter_note_cs43131 = Le filtre d'interpolation du DAC CS43131. Il modifie légèrement la réponse en haute fréquence et la latence ; Fast roll-off à faible latence est le réglage d'usine.
musicsettings_fade_note = Les dernières secondes d'un morceau s'effacent dans le silence et les premières du suivant en émergent.
musicsettings_soundstage_note = Règle la largeur de l'image stéréo : 1.00 laisse le morceau tel quel, 0.00 le ramène en mono et 2.00 élargit la scène. Uniquement pour les pistes stéréo.
musicsettings_balance_note = Déplace le son vers une oreille en baissant l'autre canal, jamais en montant celui choisi : ainsi un morceau déjà au maximum ne peut pas saturer. Uniquement pour les pistes stéréo.
musicsettings_eq_note = De -12 à +12 dB par bande. L'EQ agit sur le signal décodé.
