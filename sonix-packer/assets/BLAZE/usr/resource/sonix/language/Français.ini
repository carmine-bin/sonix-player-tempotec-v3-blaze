musicsettings_usb_dsd_native_note = Natif (expérimental) : DSD brut vers les DAC qui l'acceptent, sinon DoP, puis PCM. Comme le DoP, il joue à plein volume sur un DAC sans réglage de volume propre. Commencez à faible volume.
