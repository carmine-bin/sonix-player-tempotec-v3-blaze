medialist_random_track_queued = Morceau au hasard ajouté à la file d'attente
musicsettings_play_by_folder = Lire par dossier
musicsettings_folder_chaining_note = À la fin d'un dossier la lecture continue dans le suivant : d'abord les autres albums du même artiste, puis les morceaux isolés de son dossier, et seulement ensuite un autre artiste. Après le dernier dossier on revient au premier. Uniquement pour les dossiers ouverts depuis Explorer, pas pour les listes de la bibliothèque.
musicsettings_scan_options = Options d'analyse
musicsettings_do_not_ignore_articles = Ne pas ignorer les articles
musicsettings_detect_changes = Détecter les changements
musicsettings_detect_changes_note = Au démarrage et quand la microSD revient dans le lecteur, réinsérée, éjectée de l'ordinateur ou après le transfert Wi-Fi, les nouveaux morceaux des dossiers choisis pour l'analyse sont ajoutés à la bibliothèque et ceux supprimés en sont retirés, sans tout réanalyser. La vérification se fait en arrière-plan, avec une icône dans la barre d'état.
musicsettings_detect_retagged = Détecter les morceaux modifiés
musicsettings_detect_retagged_note = Détecter les changements relit aussi les morceaux modifiés depuis l'analyse, par exemple avec de nouveaux tags. La date de chaque fichier est vérifiée, ce qui prend plus de temps.
