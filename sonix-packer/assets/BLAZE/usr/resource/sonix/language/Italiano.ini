musicsettings_filter_note = Il filtro di interpolazione del DAC CS43198. Cambia leggermente la risposta in alta frequenza e la latenza; Fast roll-off a bassa latenza è il comportamento di fabbrica.
musicsettings_filter_note_cs43131 = Il filtro di interpolazione del DAC CS43131. Cambia leggermente la risposta in alta frequenza e la latenza; Fast roll-off a bassa latenza è il comportamento di fabbrica.
musicsettings_fade_note = Gli ultimi secondi di un brano sfumano in silenzio e i primi del successivo salgono dal silenzio.
musicsettings_soundstage_note = Regola l'ampiezza dell'immagine stereo: 1.00 lascia il brano com'è, 0.00 lo porta al mono e 2.00 allarga la scena. Vale solo per le tracce stereo.
musicsettings_balance_note = Sposta il suono verso un orecchio abbassando l'altro canale, mai alzando quello scelto: così un brano già al massimo non può distorcere. Vale solo per le tracce stereo.
