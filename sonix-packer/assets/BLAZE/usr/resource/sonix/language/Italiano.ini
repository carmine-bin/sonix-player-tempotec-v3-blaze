musicsettings_album_head = Vista alternativa per album
musicsettings_album_head_note = Quando è attiva, un album si apre con la copertina in alto, con titolo, artista, genere e anno, e i brani sotto. I brani mostrano il numero di traccia al posto della copertina.
musicsettings_rearrange_main_page = Riorganizza pagina principale
musictiles_keep_one = Almeno una tile deve restare nella pagina
musicsettings_go_to_current = Vai al brano corrente
