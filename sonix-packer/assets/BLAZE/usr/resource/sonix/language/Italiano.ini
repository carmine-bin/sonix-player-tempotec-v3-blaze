musicsettings_allow_delete = Permetti di cancellare i brani
musicsettings_allow_delete_note = In modalità di selezione compare un cestino rosso che cancella i brani scelti dalla scheda e dalla libreria, dopo una conferma. Non si può annullare.
musicsettings_shows_the_tracks_audio_quality_wi = Mostra la qualità audio del brano tramite un indicatore colorato.
musicsettings_show_artist = Mostra artista
musicsettings_show_artist_note = Mostra l'artista sotto al titolo nelle liste scelte: quello del brano nei brani, quello dell'album negli album e, dentro un album, l'artista del brano quando è diverso da quello dell'album.
musicsettings_library = Libreria
musicsettings_now_playing = Now Playing
musicsettings_track_artist = Usa artista del brano
musicsettings_track_artist_note = Mostra l'artista del brano invece dell'artista dell'album in Now Playing, nel Centro di controllo e nel salvaschermo. Se il brano non ha un artista, resta quello dell'album.
medialist_play_in_random_order = Riproduci in ordine casuale
