musicsettings_play_by_folder = Riproduci per cartella
musicsettings_folder_chaining_note = Alla fine di una cartella la riproduzione continua nella successiva: prima gli altri album dello stesso artista, poi i brani sciolti nella sua cartella, e solo dopo un altro artista. Dall'ultima cartella si torna alla prima. Vale solo per le cartelle aperte da Esplora, non per le liste della libreria.
musicsettings_scan_options = Opzioni di scansione
musicsettings_do_not_ignore_articles = Non ignorare articoli
musicsettings_detect_changes = Rileva cambiamenti
musicsettings_detect_changes_note = All'accensione e quando la microSD torna nel lettore, reinserita, espulsa dal computer o dopo il trasferimento Wi-Fi, i brani nuovi nelle cartelle scelte per la scansione vengono aggiunti alla libreria e quelli cancellati vengono tolti, senza rifare la scansione. Il controllo avviene in background, con un'icona nella barra di stato.
musicsettings_detect_retagged = Rileva brani modificati
musicsettings_detect_retagged_note = Rileva cambiamenti rilegge anche i brani modificati dopo la scansione, per esempio con i tag cambiati. Controlla la data di ogni file, quindi richiede più tempo.
